<!--this is a comment in html-->

<!DOCTYPE html>
<html lang="en">
    <head> <!--this is where the page's metadata is-->
        <!--we need to set a text standard, right?-->
        <meta charset="UTF-8">

        <!--let's make the page fit on most screens-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>so we're in copper</title>
        <!--linking to css-->
        <link rel="stylesheet" href="style.css">

    </head>

    <!--here's what we actually see-->
    <body>
        <!--where are we? (what is the game)-->
        <h1>so we're in copper</h1>

        <!--we need something to display the game-->
        <canvas id="game" width="800" height="400"></canvas>

        <!--let's define the main source file of our game-->
        <script source="game.js"></script>
    </body>
</html>
